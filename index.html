<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>Barcode Scanner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --accent: #4f8cff;
    --accent-dark: #3a6fd8;
    --text: #f2f3f5;
    --muted: #9aa0ac;
    --danger: #ff5c5c;
    --success: #35c56a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 16px 8px;
    text-align: center;
  }
  header h1 {
    font-size: 1.3rem;
    margin: 0 0 4px;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 0.85rem;
  }
  #scanner-card {
    margin: 12px 16px;
    background: var(--card);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }
  #reader {
    width: 100%;
    background: #000;
  }
  #reader video { object-fit: cover; }
  #camTools {
    display: none;
    padding: 10px 14px 0;
    align-items: center;
    gap: 10px;
  }
  #camTools.show { display: flex; }
  #camTools label {
    font-size: 0.75rem;
    color: var(--muted);
    flex: none;
  }
  #zoomRange {
    flex: 1;
    accent-color: var(--accent);
  }
  #torchBtn {
    flex: none;
    background: #2a2e38;
    color: var(--text);
    padding: 6px 10px;
    font-size: 0.85rem;
    border-radius: 8px;
  }
  #torchBtn.on { background: var(--accent); color: white; }
  #tip {
    padding: 8px 16px 0;
    font-size: 0.75rem;
    color: var(--muted);
    text-align: center;
  }
  #controls {
    padding: 14px;
    display: flex;
    gap: 10px;
  }
  button {
    flex: 1;
    padding: 13px 12px;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  button:active { opacity: 0.75; }
  #startBtn { background: var(--accent); color: white; }
  #stopBtn { background: #2a2e38; color: var(--text); display: none; }
  #status {
    padding: 0 16px;
    min-height: 20px;
    text-align: center;
    font-size: 0.85rem;
    color: var(--muted);
  }
  #status.ok { color: var(--success); }
  #status.err { color: var(--danger); }
  #last-scan {
    margin: 4px 16px 0;
    background: var(--card);
    border-radius: 12px;
    padding: 14px;
    display: none;
  }
  #last-scan.show { display: block; }
  #last-scan .code {
    font-size: 1.15rem;
    font-weight: 700;
    word-break: break-all;
  }
  #last-scan .fmt {
    color: var(--muted);
    font-size: 0.78rem;
    margin-top: 2px;
  }
  section#history {
    flex: 1;
    margin: 16px 16px 24px;
  }
  #history-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  #history-head h2 {
    font-size: 1rem;
    margin: 0;
    color: var(--text);
  }
  #history-actions { display: flex; gap: 8px; }
  #history-actions button {
    flex: none;
    padding: 7px 12px;
    font-size: 0.78rem;
    background: #2a2e38;
    color: var(--text);
  }
  #history-actions button#clearBtn { background: #3a1f22; color: var(--danger); }
  ul#history-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  ul#history-list li {
    background: var(--card);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  ul#history-list li .info { min-width: 0; flex: 1; }
  ul#history-list li .pname {
    font-weight: 700;
    font-size: 1.02rem;
    word-break: break-word;
  }
  ul#history-list li .pname.empty {
    color: var(--muted);
    font-weight: 400;
    font-style: italic;
  }
  ul#history-list li .sku {
    color: var(--accent);
    font-size: 0.85rem;
    font-weight: 600;
    margin-top: 3px;
    word-break: break-all;
  }
  ul#history-list li .sku.empty {
    color: var(--muted);
    font-weight: 400;
    font-style: italic;
  }
  ul#history-list li .code {
    font-weight: 500;
    font-size: 0.78rem;
    color: var(--muted);
    word-break: break-all;
    margin-top: 3px;
  }
  ul#history-list li .meta {
    color: var(--muted);
    font-size: 0.72rem;
    margin-top: 2px;
  }
  ul#history-list li .item-actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: none;
  }
  ul#history-list li .item-actions button {
    background: transparent;
    color: var(--muted);
    flex: none;
    padding: 4px 8px;
    font-size: 0.9rem;
    line-height: 1;
  }
  ul#history-list li .item-actions button.del { color: var(--danger); }
  ul#history-list li .item-actions button.edit { color: var(--accent); }
  #empty {
    color: var(--muted);
    font-size: 0.85rem;
    text-align: center;
    padding: 24px 0;
  }
  .edit-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex: 1;
  }
  .edit-row .field-wrap {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .edit-row .field-label {
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--accent);
  }
  .edit-row input {
    background: #11141b;
    border: 1px solid #2a2e38;
    color: var(--text);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.88rem;
    width: 100%;
  }
  .edit-row .edit-buttons {
    display: flex;
    gap: 8px;
  }
  .edit-row .edit-buttons button {
    flex: 1;
    padding: 7px 10px;
    font-size: 0.78rem;
  }
  .edit-row .save-btn { background: var(--accent); color: white; }
  .edit-row .cancel-btn { background: #2a2e38; color: var(--text); }
  #manualBtn {
    flex: none;
    background: #2a2e38;
    color: var(--text);
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>📷 Barcode Scanner</h1>
    <p>Point your camera at a barcode to scan it</p>
  </header>

  <div id="scanner-card">
    <div id="reader"></div>
    <div id="camTools">
      <label for="zoomRange">Zoom</label>
      <input type="range" id="zoomRange" min="1" max="5" step="0.1" value="1" />
      <button id="torchBtn">🔦</button>
    </div>
    <div id="tip">Small barcode? Move closer, use Zoom, and hold steady until it focuses.</div>
    <div id="controls">
      <button id="startBtn">Start Scanning</button>
      <button id="stopBtn">Stop</button>
    </div>
  </div>
  <div id="status"></div>

  <div id="last-scan">
    <div class="code" id="lastCode">—</div>
    <div class="fmt" id="lastFmt"></div>
  </div>

  <section id="history">
    <div id="history-head">
      <h2>Scan History</h2>
      <div id="history-actions">
        <button id="manualBtn">+ Add</button>
        <button id="exportBtn">Export CSV</button>
        <button id="clearBtn">Clear</button>
      </div>
    </div>
    <ul id="history-list"></ul>
    <div id="empty">No scans yet</div>
  </section>
</div>

<script>
(function () {
  const STORAGE_KEY = "barcodeScanHistory";
  let html5Qr = null;
  let scanning = false;
  let lastCode = null;
  let lastScanTime = 0;

  const startBtn = document.getElementById("startBtn");
  const stopBtn = document.getElementById("stopBtn");
  const statusEl = document.getElementById("status");
  const lastScanEl = document.getElementById("last-scan");
  const lastCodeEl = document.getElementById("lastCode");
  const lastFmtEl = document.getElementById("lastFmt");
  const historyList = document.getElementById("history-list");
  const emptyEl = document.getElementById("empty");
  const exportBtn = document.getElementById("exportBtn");
  const clearBtn = document.getElementById("clearBtn");
  const manualBtn = document.getElementById("manualBtn");
  const camTools = document.getElementById("camTools");
  const zoomRange = document.getElementById("zoomRange");
  const torchBtn = document.getElementById("torchBtn");

  let editingId = null;
  let torchOn = false;

  function loadHistory() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    } catch (e) {
      return [];
    }
  }

  function saveHistory(history) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
  }

  function updateEntry(id, changes) {
    const history = loadHistory();
    const idx = history.findIndex((e) => e.id === id);
    if (idx === -1) return;
    history[idx] = Object.assign({}, history[idx], changes);
    saveHistory(history);
  }

  function renderHistory() {
    const history = loadHistory();
    historyList.innerHTML = "";
    if (history.length === 0) {
      emptyEl.style.display = "block";
      return;
    }
    emptyEl.style.display = "none";
    history.forEach((entry) => {
      const li = document.createElement("li");

      if (editingId === entry.id) {
        // ---- edit mode ----
        const row = document.createElement("div");
        row.className = "edit-row";

        function field(labelText, placeholder, value) {
          const wrap = document.createElement("div");
          wrap.className = "field-wrap";
          const label = document.createElement("label");
          label.className = "field-label";
          label.textContent = labelText;
          const input = document.createElement("input");
          input.placeholder = placeholder;
          input.value = value || "";
          wrap.appendChild(label);
          wrap.appendChild(input);
          return { wrap, input };
        }

        const nameField = field("Product Name", "e.g. 1L Handcrafted Design", entry.name);
        const skuField = field("Product SKU", "e.g. Prithvi", entry.sku);
        const codeField = field("Barcode value", "Barcode value", entry.code);

        const btnRow = document.createElement("div");
        btnRow.className = "edit-buttons";

        const saveBtn = document.createElement("button");
        saveBtn.className = "save-btn";
        saveBtn.textContent = "Save";
        saveBtn.addEventListener("click", () => {
          updateEntry(entry.id, {
            name: nameField.input.value.trim(),
            sku: skuField.input.value.trim(),
            code: codeField.input.value.trim() || entry.code
          });
          editingId = null;
          renderHistory();
        });

        const cancelBtn = document.createElement("button");
        cancelBtn.className = "cancel-btn";
        cancelBtn.textContent = "Cancel";
        cancelBtn.addEventListener("click", () => {
          editingId = null;
          renderHistory();
        });

        btnRow.appendChild(saveBtn);
        btnRow.appendChild(cancelBtn);
        row.appendChild(nameField.wrap);
        row.appendChild(skuField.wrap);
        row.appendChild(codeField.wrap);
        row.appendChild(btnRow);
        li.appendChild(row);
      } else {
        // ---- display mode ----
        const info = document.createElement("div");
        info.className = "info";

        const nameDiv = document.createElement("div");
        if (entry.name) {
          nameDiv.className = "pname";
          nameDiv.textContent = "Name: " + entry.name;
        } else {
          nameDiv.className = "pname empty";
          nameDiv.textContent = "No product name — tap ✎ Edit to add one";
        }

        const skuDiv = document.createElement("div");
        if (entry.sku) {
          skuDiv.className = "sku";
          skuDiv.textContent = "SKU: " + entry.sku;
        } else {
          skuDiv.className = "sku empty";
          skuDiv.textContent = "No SKU set — tap ✎ Edit to add one";
        }

        const codeDiv = document.createElement("div");
        codeDiv.className = "code";
        codeDiv.textContent = "Barcode: " + entry.code;

        const metaDiv = document.createElement("div");
        metaDiv.className = "meta";
        const d = new Date(entry.time);
        metaDiv.textContent = "Format: " + entry.format + " · " + d.toLocaleString();

        info.appendChild(nameDiv);
        info.appendChild(skuDiv);
        info.appendChild(codeDiv);
        info.appendChild(metaDiv);

        const actions = document.createElement("div");
        actions.className = "item-actions";

        const editBtn = document.createElement("button");
        editBtn.className = "edit";
        editBtn.textContent = "✎";
        editBtn.addEventListener("click", () => {
          editingId = entry.id;
          renderHistory();
        });

        const delBtn = document.createElement("button");
        delBtn.className = "del";
        delBtn.textContent = "✕";
        delBtn.addEventListener("click", () => {
          const h = loadHistory().filter((e) => e.id !== entry.id);
          saveHistory(h);
          renderHistory();
        });

        actions.appendChild(editBtn);
        actions.appendChild(delBtn);

        li.appendChild(info);
        li.appendChild(actions);
      }

      historyList.appendChild(li);
    });
  }

  function addScan(code, format) {
    const now = Date.now();
    // debounce duplicate reads of the same code within 2.5s
    if (code === lastCode && now - lastScanTime < 2500) return;
    lastCode = code;
    lastScanTime = now;

    const id = now + "-" + Math.random().toString(36).slice(2);
    const history = loadHistory();
    history.unshift({ id, code, format, name: "", sku: "", time: now });
    saveHistory(history);
    editingId = id; // open edit mode immediately so name + SKU can be added/corrected
    renderHistory();

    lastCodeEl.textContent = code;
    lastFmtEl.textContent = format;
    lastScanEl.classList.add("show");

    if (navigator.vibrate) navigator.vibrate(80);
    setStatus("Scanned — add the product name and SKU below", "ok");
  }

  function addManualEntry() {
    const code = prompt("Barcode value (leave blank if unknown):", "") || "";
    const name = prompt("Product name:", "") || "";
    const sku = prompt("Product SKU:", "") || "";
    if (!code && !name && !sku) return;
    const now = Date.now();
    const history = loadHistory();
    history.unshift({
      id: now + "-" + Math.random().toString(36).slice(2),
      code: code.trim() || "(no barcode)",
      format: "Manual",
      name: name.trim(),
      sku: sku.trim(),
      time: now
    });
    saveHistory(history);
    renderHistory();
  }

  function setStatus(msg, kind) {
    statusEl.textContent = msg || "";
    statusEl.className = kind ? kind : "";
  }

  async function startScanning() {
    if (scanning) return;
    setStatus("Starting camera…");
    html5Qr = new Html5Qrcode("reader", {
      formatsToSupport: [
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.CODABAR,
        Html5QrcodeSupportedFormats.ITF,
        Html5QrcodeSupportedFormats.QR_CODE
      ],
      verbose: false
    });

    const config = {
      fps: 15,
      qrbox: (viewfinderWidth, viewfinderHeight) => {
        const size = Math.floor(Math.min(viewfinderWidth, viewfinderHeight) * 0.7);
        return { width: size, height: Math.floor(size * 0.42) };
      },
      aspectRatio: 1.2,
      disableFlip: false,
      experimentalFeatures: {
        useBarCodeDetectorIfSupported: true
      },
      videoConstraints: {
        facingMode: "environment",
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        advanced: [{ focusMode: "continuous" }]
      }
    };

    try {
      await html5Qr.start(
        { facingMode: "environment" },
        config,
        (decodedText, decodedResult) => {
          const format =
            (decodedResult && decodedResult.result && decodedResult.result.format &&
              decodedResult.result.format.formatName) || "Unknown";
          addScan(decodedText, format);
        },
        () => {
          /* per-frame decode failure, ignore */
        }
      );
      scanning = true;
      startBtn.style.display = "none";
      stopBtn.style.display = "block";
      setStatus("Scanning… point camera at a barcode");
      setupCameraTools();
    } catch (err) {
      setStatus("Camera error: " + (err && err.message ? err.message : err), "err");
    }
  }

  function setupCameraTools() {
    camTools.classList.remove("show");
    torchBtn.style.display = "none";
    zoomRange.style.display = "none";
    if (!html5Qr || typeof html5Qr.getRunningTrackCapabilities !== "function") return;

    let caps;
    try {
      caps = html5Qr.getRunningTrackCapabilities();
    } catch (e) {
      return;
    }
    if (!caps) return;

    let anyToolShown = false;

    if (caps.zoom && caps.zoom.min !== undefined && caps.zoom.max !== undefined) {
      zoomRange.min = caps.zoom.min;
      zoomRange.max = caps.zoom.max;
      zoomRange.step = caps.zoom.step || 0.1;
      zoomRange.value = caps.zoom.min;
      zoomRange.style.display = "block";
      anyToolShown = true;
    }

    if (caps.torch) {
      torchOn = false;
      torchBtn.classList.remove("on");
      torchBtn.style.display = "block";
      anyToolShown = true;
    }

    if (anyToolShown) camTools.classList.add("show");
  }

  zoomRange.addEventListener("input", () => {
    if (!html5Qr || typeof html5Qr.applyVideoConstraints !== "function") return;
    const val = parseFloat(zoomRange.value);
    html5Qr.applyVideoConstraints({ advanced: [{ zoom: val }] }).catch(() => {});
  });

  torchBtn.addEventListener("click", () => {
    if (!html5Qr || typeof html5Qr.applyVideoConstraints !== "function") return;
    torchOn = !torchOn;
    html5Qr.applyVideoConstraints({ advanced: [{ torch: torchOn }] }).catch(() => {
      torchOn = !torchOn;
    });
    torchBtn.classList.toggle("on", torchOn);
  });

  async function stopScanning() {
    if (!scanning || !html5Qr) return;
    try {
      await html5Qr.stop();
      await html5Qr.clear();
    } catch (e) {
      /* ignore */
    }
    scanning = false;
    startBtn.style.display = "block";
    stopBtn.style.display = "none";
    camTools.classList.remove("show");
    torchOn = false;
    setStatus("Stopped");
  }

  function exportCsv() {
    const history = loadHistory();
    if (history.length === 0) {
      setStatus("Nothing to export", "err");
      return;
    }
    let csv = "product_name,sku,code,format,timestamp\n";
    history.forEach((e) => {
      const iso = new Date(e.time).toISOString();
      const name = e.name || "";
      const sku = e.sku || "";
      csv += `"${name.replace(/"/g, '""')}","${sku.replace(/"/g, '""')}","${e.code.replace(/"/g, '""')}","${e.format}","${iso}"\n`;
    });
    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "barcode-scans.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  startBtn.addEventListener("click", startScanning);
  stopBtn.addEventListener("click", stopScanning);
  exportBtn.addEventListener("click", exportCsv);
  manualBtn.addEventListener("click", addManualEntry);
  clearBtn.addEventListener("click", () => {
    if (confirm("Clear all scan history?")) {
      saveHistory([]);
      renderHistory();
    }
  });

  if (!("mediaDevices" in navigator) || !navigator.mediaDevices.getUserMedia) {
    setStatus("Camera not supported in this browser. Use Chrome on Android over HTTPS.", "err");
    startBtn.disabled = true;
  } else if (!window.isSecureContext) {
    setStatus("Camera requires HTTPS or localhost. Host this file over HTTPS to use the camera.", "err");
  }

  renderHistory();
})();
</script>
</body>
</html>
